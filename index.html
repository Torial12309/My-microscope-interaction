<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Microscope Lab</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin: 5px 0 15px 0; font-size: 1.25rem; color: #38bdf8; text-align: center; }

        /* ================= PART 1: MICROSCOPE IMAGE (TOP) ================= */
        .top-image-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            background: #1e293b;
        }
        .top-image-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Interactive Hotspots on Image */
        .hotspot-dot {
            position: absolute;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.85);
            border: 3px solid #ffffff;
            color: #0f172a;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
            animation: pulse 1.8s infinite;
            transition: transform 0.2s, background 0.2s;
        }
        .hotspot-dot:hover, .hotspot-dot.active {
            background: #fbbf24;
            transform: translate(-50%, -50%) scale(1.2);
            animation: none;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* ================= PART 2: ADJUSTMENT WORKSPACE (BOTTOM) ================= */
        .bottom-workspace {
            display: none; /* Hidden until a hotspot is clicked */
            margin-top: 20px;
            width: 100%;
            max-width: 550px;
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .workspace-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        /* Eyepiece Specimen Preview */
        .lens-preview {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 6px solid #020617;
            overflow: hidden;
            position: relative;
            background: #000;
            flex-shrink: 0;
        }
        .lens-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s ease, filter 0.1s linear;
        }

        /* Dynamic Control Panel */
        .control-area {
            flex: 1;
            min-width: 220px;
            text-align: center;
        }
        .part-title { font-size: 1.15rem; font-weight: bold; color: #fbbf24; margin-bottom: 6px; }
        .part-desc { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 15px; }

        /* Rotary Knob Visual */
        .knob-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .rotary-knob {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: conic-gradient(#475569, #94a3b8, #334155, #475569);
            border: 4px solid #e2e8f0;
            position: relative;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .rotary-knob::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 16px;
            background: #ef4444;
            border-radius: 3px;
        }
        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn:hover { background: #2563eb; }
        .btn.active { background: #10b981; }
        .status-text { margin-top: 12px; font-size: 0.85rem; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🔬 Click on the numbered parts to adjust the microscope</h2>

    <!-- ================= PART 1: MICROSCOPE IMAGE ================= -->
    <div class="top-image-container">
        <img src="microscope.jpg" alt="Microscope Diagram" onerror="this.src='https://placehold.co'">

        <!-- Adjust hotspot positions using top (%) and left (%) -->
        <button class="hotspot-dot" style="top: 38%; left: 45%;" onclick="openControl('lens', this)" title="Objective Lenses">1</button>
        <button class="hotspot-dot" style="top: 52%; left: 45%;" onclick="openControl('stage', this)" title="Mechanical Stage">2</button>
        <button class="hotspot-dot" style="top: 65%; left: 68%;" onclick="openControl('focus', this)" title="Focus Knobs">3</button>
        <button class="hotspot-dot" style="top: 78%; left: 45%;" onclick="openControl('light', this)" title="Light Intensity">4</button>
    </div>

    <!-- ================= PART 2: ADJUSTMENT WORKSPACE ================= -->
    <div class="bottom-workspace" id="workspace">
        <div class="workspace-grid">
            <!-- Specimen View -->
            <div class="lens-preview">
                <img id="specimenImg" src="cell.jpg" alt="Specimen View" onerror="this.src='https://placehold.co'">
            </div>

            <!-- Controls Area -->
            <div class="control-area">
                <div id="dynamicControls"></div>
                <div class="status-text" id="statusDisplay">Magnification: 4x | Clarity: Blurry | Light: 100%</div>
            </div>
        </div>
    </div>

    <script>
        let sim = {
            zoom: 1,
            zoomText: '4x',
            focus: 4,         // 0 = sharpest focus
            targetFocus: 0,
            brightness: 100,
            x: 0,
            y: 0,
            focusDeg: 0,
            lightDeg: 0
        };

        // Update CSS Filters and Transform on the specimen image
        function applyFilters() {
            const img = document.getElementById('specimenImg');
            const blurPx = Math.abs(sim.focus - sim.targetFocus) * 1.5;

            img.style.filter = `blur(${blurPx}px) brightness(${sim.brightness}%)`;
            img.style.transform = `scale(${sim.zoom}) translate(${sim.x}px, ${sim.y}px)`;

            const clarity = blurPx === 0 ? "100% Sharp" : `Blurry (${blurPx.toFixed(1)}px)`;
            document.getElementById('statusDisplay').innerText = 
                `Magnification: ${sim.zoomText} | ${clarity} | Light: ${sim.brightness}%`;
        }

        // Reveal bottom panel when a hotspot is clicked
        function openControl(part, btnElement) {
            document.querySelectorAll('.hotspot-dot').forEach(dot => dot.classList.remove('active'));
            btnElement.classList.add('active');

            const workspace = document.getElementById('workspace');
            workspace.style.display = 'block';
            workspace.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            const box = document.getElementById('dynamicControls');

            if (part === 'focus') {
                box.innerHTML = `
                    <div class="part-title">3. Coarse & Fine Focus Knob</div>
                    <div class="part-desc">Rotate the knob to bring the specimen into sharp focus.</div>
                    <div class="knob-row">
                        <button class="btn" onclick="changeFocus(-1)">↺ Counter-CW</button>
                        <div class="rotary-knob" id="knobUI" style="transform: rotate(${sim.focusDeg}deg)"></div>
                        <button class="btn" onclick="changeFocus(1)">Clockwise ↻</button>
                    </div>
                `;
            } 
            else if (part === 'light') {
                box.innerHTML = `
                    <div class="part-title">4. Illuminator Light Control</div>
                    <div class="part-desc">Turn the dial to increase or decrease light brightness.</div>
                    <div class="knob-row">
                        <button class="btn" onclick="changeLight(-20)">↺ Dim</button>
                        <div class="rotary-knob" id="knobUI" style="transform: rotate(${sim.lightDeg}deg)"></div>
                        <button class="btn" onclick="changeLight(20)">Brighten ↻</button>
                    </div>
                `;
            } 
            else if (part === 'lens') {
                box.innerHTML = `
                    <div class="part-title">1. Revolving Nosepiece (Objectives)</div>
                    <div class="part-desc">Select an objective lens to change magnification level.</div>
